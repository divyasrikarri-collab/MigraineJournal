name: Publish to Play (internal track)

# Tag-triggered on purpose. Publishing on every push to a branch is how a bad build reaches
# users; tagging is a deliberate act.
#
#   git tag v1.0.1 && git push origin v1.0.1
#
# NOTE: this cannot perform the FIRST upload of the app. The Google Play Developer API cannot
# create a listing, and it refuses uploads for a package until one bundle has been uploaded by
# hand in the Play Console. Do release 1 manually; this workflow handles release 2 onward.
#
# Required repository secrets:
#   PLAY_SERVICE_ACCOUNT_JSON  service account key JSON, granted release permission in Play
#   KEYSTORE_BASE64            base64 -w0 migrainejournal-upload.jks
#   KEYSTORE_PASSWORD
#   KEY_ALIAS
#   KEY_PASSWORD

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and upload bundle
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Fail here with a readable message rather than deep inside the upload action.
      - name: Check required secrets are present
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          missing=""
          [ -n "$PLAY_JSON" ] || missing="$missing PLAY_SERVICE_ACCOUNT_JSON"
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing KEYSTORE_BASE64"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secret(s):$missing — see the header of this workflow."
            exit 1
          fi

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      # Written outside the workspace so it cannot be picked up by an artifact upload.
      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          umask 077
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # versionCode must strictly increase on every upload. run_number is monotonic per
      # workflow, so it satisfies that without anyone having to remember to bump a file.
      # versionName comes from the tag: v1.2.3 -> 1.2.3.
      - name: Build signed bundle
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '1.0' }}
        run: |
          export VERSION_NAME="${VERSION_NAME#v}"
          echo "Building versionCode=$VERSION_CODE versionName=$VERSION_NAME"
          ./gradlew bundleRelease --stacktrace

      - name: Upload to Play internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.divyasrikarri.migrainejournal
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      # Needed to deobfuscate any crash report from this build. Without it an R8 stack trace
      # from a user is unreadable.
      - name: Archive R8 mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ github.ref_name }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 365

      - name: Remove keystore material
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/upload.jks"
